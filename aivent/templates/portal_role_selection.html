{% extends "partials/layouts/main.html" %}

{% block content %}
<style>
    .dashboard-card {
        background: rgba(30, 41, 59, 0.85);
        backdrop-filter: blur(10px);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 50px 30px;
    }
    .role-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 30px;
    }
    .role-card {
        background: #0F172A;
        border: 2px solid #334155;
        border-radius: 12px;
        padding: 30px 15px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        color: #94A3B8;
    }
    .role-card:hover {
        border-color: #6366F1;
        background: rgba(99, 102, 241, 0.1);
    }
    .role-card input[type="radio"] { display: none; }
    .role-card input[type="radio"]:checked + div { color: #fff; }
    .role-card.selected {
        border-color: #4F46E5;
        background: rgba(79, 70, 229, 0.2);
        color: #fff;
    }
    .role-icon { font-size: 32px; margin-bottom: 15px; display: block; }
    @media(max-width: 768px) { .role-grid { grid-template-columns: 1fr; } }
</style>

<section class="section-dark text-light pb-60 relative jarallax" style="padding-top: 160px; min-height: 100vh;">
    <img src="/static/assets/images/background/9.webp" class="jarallax-img" alt="Background">
    <div class="sw-overlay op-8"></div>

    <div class="container relative z-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="dashboard-card text-center">
                    <h2 class="fs-36 fw-bold text-white mb-3">Welcome to IST, {{ user.username }}!</h2>
                    <p class="mb-5" style="color: #94A3B8; font-size: 16px;">To personalize your experience, please tell us how you want to use the portal.</p>
                    
                    <form method="POST" action="{{ url_for('public_pages.update_role') }}">
                        <div class="role-grid">
                            <label class="role-card selected" id="card-student">
                                <input type="radio" name="role" value="student" checked onchange="updateSelection('card-student')">
                                <div>
                                    <i class="fas fa-user-graduate role-icon" style="color: #8b5cf6;"></i>
                                    <span style="font-weight: 600; font-size: 18px;">Student</span>
                                </div>
                            </label>
                            <label class="role-card" id="card-professional">
                                <input type="radio" name="role" value="professional" onchange="updateSelection('card-professional')">
                                <div>
                                    <i class="fas fa-briefcase role-icon" style="color: #3b82f6;"></i>
                                    <span style="font-weight: 600; font-size: 18px;">Professional</span>
                                </div>
                            </label>
                            <label class="role-card" id="card-client">
                                <input type="radio" name="role" value="client" onchange="updateSelection('card-client')">
                                <div>
                                    <i class="fas fa-building role-icon" style="color: #10b981;"></i>
                                    <span style="font-weight: 600; font-size: 18px;">Client</span>
                                </div>
                            </label>
                        </div>
                        <button type="submit" class="btn-main w-100" style="border: none; border-radius: 10px; padding: 14px; background: #4F46E5; font-size: 16px;">
                            Continue to Dashboard <i class="fas fa-arrow-right ms-2"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    function updateSelection(selectedId) {
        document.querySelectorAll('.role-card').forEach(card => card.classList.remove('selected'));
        document.getElementById(selectedId).classList.add('selected');
    }
</script>
{% endblock %}
