<style>
    #mainmenu ul ul li a.sub-active {
        color: #8b5cf6 !important;
        font-weight: 600 !important;
        border: none !important;
        text-decoration: none !important;
        box-shadow: none !important;
    }

    .menu_side_area {
        display: none !important;
    }

    #menu-btn {
        width: 24px;
        height: 24px;
        position: relative;
        cursor: pointer;
        background: transparent !important;
    }

    #menu-btn::before,
    #menu-btn::after {
        content: "" !important;
        display: none !important;
    }

    #menu-btn span {
        display: block;
        position: absolute;
        width: 100%;
        height: 2px;
        background: #ffffff;
        border-radius: 9px;
        transition: all 0.3s ease;
        transform-origin: left center;
    }

    #menu-btn span:nth-child(1) { top: 4px; }
    #menu-btn span:nth-child(2) { top: 11px; }
    #menu-btn span:nth-child(3) { top: 18px; }

    #menu-btn.open span:nth-child(1) {
        transform: rotate(45deg);
        top: 3px;
        left: 4px;
    }

    #menu-btn.open span:nth-child(2) {
        opacity: 0;
        width: 0;
    }

    #menu-btn.open span:nth-child(3) {
        transform: rotate(-45deg);
        top: 20px;
        left: 4px;
    }

    .header-actions {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .btn-login {
        background: #4F46E5 !important;
        color: white !important;
    }

    .btn-logout {
        background: #DC2626 !important;
        color: white !important;
    }

    @media (max-width: 991px) {
        .menu_side_area {
            display: inline-block !important;
            margin-left: 15px;
        }
        .header-col-mid {
            display: none;
        }
        .header-actions .btn-main {
            display: none;
        }
    }
</style>

<header class="transparent">
    <div class="container-fluid px-4">
        <div class="row">
            <div class="col-md-12">
                <div class="de-flex justify-content-between w-100 align-items-center">

                    <div class="de-flex-col p-0 m-0">
                        <div id="logo">
                            <a href="/">
                                <img class="logo-main" src="/static/assets/images/logo.png" alt="IST Logo">
                                <img class="logo-scroll" src="/static/assets/images/logo.png" alt="IST Logo">
                                <img class="logo-mobile" src="/static/assets/images/logo.png" alt="IST Logo">
                            </a>
                        </div>
                    </div>

                    <div class="de-flex-col header-col-mid">
                        <ul id="mainmenu" class="m-0 p-0">
                            <li><a class="menu-item" href="/">Home</a></li>
                            <li>
                                <a class="menu-item" href="{{ url_for('public_pages.about') }}">About Us</a>
                                <ul>
                                    <li><a class="menu-item" href="{{ url_for('public_pages.about') }}">About</a></li>
                                    <li><a class="menu-item" href="{{ url_for('public_pages.journey') }}">Our Journey</a></li>
                                </ul>
                            </li>
                            <li>
                                <a class="menu-item" href="#">Services</a>
                                <ul>
                                    <li><a class="menu-item" href="{{ url_for('public_pages.services') }}">Core Services</a></li>
                                    <li><a class="menu-item" href="{{ url_for('public_pages.projects') }}">College - Final Year Projects</a></li>
                                </ul>
                            </li>
                            <li><a class="menu-item" href="{{ url_for('public_pages.products') }}">Products</a></li>
                            <li>
                                <a class="menu-item" href="#">Careers</a>
                                <ul>
                                    <li><a class="menu-item" href="{{ url_for('public_pages.join_us') }}">Join Us</a></li>
                                    <li><a class="menu-item" href="{{ url_for('public_pages.interns') }}">Internship</a></li>
                                </ul>
                            </li>
                        </ul>
                    </div>

                    <div class="de-flex-col p-0 m-0">
                        <div class="header-actions">
                            {% if current_user.is_authenticated %}
                                <a class="btn-main fx-slide" href="{{ url_for('public_pages.portal') }}">
                                    <span>Dashboard</span>
                                </a>
                                <a class="btn-main fx-slide btn-logout" href="{{ url_for('logout') }}">
                                    <span>Logout</span>
                                </a>
                            {% else %}
                                <a class="btn-main fx-slide btn-login" href="{{ url_for('public_pages.portal_login') }}">
                                    <span>Login</span>
                                </a>
                                <a class="btn-main fx-slide" href="{{ url_for('public_pages.contact') }}">
                                    <span>Get In Touch</span>
                                </a>
                            {% endif %}

                            <div class="menu_side_area">
                                <div id="menu-btn">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</header>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const currentLocation = window.location.href;
    const menuItems = document.querySelectorAll("#mainmenu a.menu-item");

    menuItems.forEach(item => {
        if (item.href === currentLocation) {
            const parentUl = item.closest("ul");
            if (parentUl && parentUl.id !== "mainmenu") {
                item.classList.add("sub-active");
                const parentLi = parentUl.closest("li");
                if (parentLi) {
                    const parentLink = parentLi.querySelector("a.menu-item");
                    if (parentLink) {
                        parentLink.classList.add("active");
                    }
                }
            } else {
                item.classList.add("active");
            }
        }
    });

    const menuBtn = document.getElementById("menu-btn");
    if (menuBtn) {
        menuBtn.addEventListener("click", function () {
            this.classList.toggle("open");
        });
    }
});
</script>
